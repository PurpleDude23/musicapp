<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse — Music Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="logo">Pulse</h1>
      <div class="transport">
        <button type="button" class="btn btn-play" id="playBtn" aria-label="Play">
          <span class="icon-play"></span>
        </button>
        <button type="button" class="btn btn-stop" id="stopBtn" aria-label="Stop">Stop</button>
        <span class="bpm-wrap">
          <label for="bpm">BPM</label>
          <input type="range" id="bpm" min="60" max="180" value="120">
          <span id="bpmVal">120</span>
        </span>
      </div>
    </header>

    <main class="main">
      <section class="panel synth-panel">
        <h2>Synth</h2>
        <div class="keyboard" id="keyboard" role="group" aria-label="Keyboard">
          <!-- Keys generated by JS -->
        </div>
        <div class="synth-controls">
          <label>
            <span>Attack</span>
            <input type="range" id="attack" min="0" max="1" step="0.01" value="0.1">
          </label>
          <label>
            <span>Release</span>
            <input type="range" id="release" min="0" max="2" step="0.01" value="0.5">
          </label>
        </div>
      </section>

      <section class="panel drums-panel">
        <h2>Drums</h2>
        <div class="drum-pads" id="drumPads" role="group" aria-label="Drum pads">
          <button type="button" class="drum-pad" data-note="kick">Kick</button>
          <button type="button" class="drum-pad" data-note="snare">Snare</button>
          <button type="button" class="drum-pad" data-note="hihat">Hi-Hat</button>
          <button type="button" class="drum-pad" data-note="clap">Clap</button>
          <button type="button" class="drum-pad" data-note="tom">Tom</button>
          <button type="button" class="drum-pad" data-note="openhat">Open Hat</button>
        </div>
      </section>

      <section class="panel sequencer-panel">
        <h2>Step Sequencer</h2>
        <div class="sequencer-grid" id="sequencer">
          <!-- Rows generated by JS -->
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
  <script src="app.js"></script>
</body>
</html>
